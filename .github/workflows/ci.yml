name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      # The GitHub Pages build too, so the UI tests can drive it under its security
      # policy. An empty cloud.json is allowed here: the tests use the test server.
      - name: Hosted build
        run: npm run build:pages
        env:
          LEDGER_ALLOW_EMPTY_CLOUD: '1'
      - name: Install a browser for the UI tests
        run: npx playwright install --with-deps chromium
      - name: UI tests
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      # dist/ and standalone/ are committed build output. A fresh build never matches
      # byte for byte (each build stamps its own time), so what is checked is the
      # history: has source changed since the build was last committed?
      - name: Committed build is current
        run: |
          built=$(git log -1 --format=%H -- dist standalone)
          if [ -z "$built" ]; then
            echo "::error::No commit in history touches dist/ or standalone/."
            exit 1
          fi
          since=$(git rev-list "$built"..HEAD -- src index.html server vite.config.ts package.json package-lock.json public)
          if [ -n "$since" ]; then
            echo "::error::dist/ and standalone/ were last built at $(git log -1 --format=%h\ %s "$built"), and source has changed since. Run 'npm run build' and commit the result."
            exit 1
          fi
